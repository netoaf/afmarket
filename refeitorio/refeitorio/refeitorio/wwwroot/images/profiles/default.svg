<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="90" cy="90" r="90" fill="#007BFF"/>
  
  <!-- Person silhouette -->
  <circle cx="90" cy="65" r="25" fill="white"/>
  <path d="M90 100C65 100 40 112 40 130V160C40 165 45 170 50 170H130C135 170 140 165 140 160V130C140 112 115 100 90 100Z" fill="white"/>
  
  <!-- Optional: Add a subtle gradient -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0056b3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007BFF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Apply gradient to background -->
  <circle cx="90" cy="90" r="90" fill="url(#gradient)"/>
  
  <!-- Redraw person on top of gradient -->
  <circle cx="90" cy="65" r="25" fill="white"/>
  <path d="M90 100C65 100 40 112 40 130V160C40 165 45 170 50 170H130C135 170 140 165 140 160V130C140 112 115 100 90 100Z" fill="white"/>
</svg>
