name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore AFMarket.sln
      - name: Build
        run: dotnet build AFMarket.sln --configuration Release --no-restore
      - name: Restore and build Refeitorio API
        run: |
          dotnet restore refeitorio/Refeitorio_API/Refeitorio_API.sln
          dotnet build refeitorio/Refeitorio_API/Refeitorio_API.sln --configuration Release --no-restore
      - name: Restore and build Refeitorio MVC
        run: |
          dotnet restore refeitorio/refeitorio/refeitorio.sln
          dotnet build refeitorio/refeitorio/refeitorio.sln --configuration Release --no-restore
      - name: Test Refeitorio API
        run: dotnet test refeitorio/Refeitorio_API/Refeitorio_API.sln --configuration Release --no-build
